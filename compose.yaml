name: aion

services:
  # Pinned Community CalVer release (verified 2026-08-28: latest published tag,
  # GDS 2026.07.0 loads, 471 gds.* procedures, native CREATE VECTOR INDEX works).
  # Bump by hand. Nothing regenerates this from the Docker Hub tag list.
  neo4j:
    image: neo4j:2026.07.1-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${AION_NEO4J_PASSWORD:-aion}
      NEO4J_PLUGINS: '["graph-data-science"]'
      # Modest laptop tuning, not a capacity plan: one user, one graph, JVM default
      # heuristics otherwise over-claim RAM on a shared dev machine.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      # Unset, the server default keeps transaction logs indefinitely: measured at 1.6GB for
      # a 105MB graph after a write-heavy session (thousands of small idempotent MERGEs per
      # episode). This product targets one laptop, not point-in-time recovery.
      NEO4J_db_tx__log_rotation_retention__policy: '2 days 1G'
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'
    volumes:
      - aion-neo4j:/data

  aion-mcp:
    profiles: ['mcp']
    image: aion-local:latest
    restart: unless-stopped
    # The service drains tool calls already running before it closes the driver and SQLite.
    # Compose's 10s default would SIGKILL it partway through that, which is the failure the
    # drain exists to prevent.
    stop_grace_period: 20s
    # The logger tees to stdout as well as the data-volume file (see logger.ts). Docker's
    # json-file driver keeps container logs unbounded by default, so the stdout copy would
    # grow without limit on a laptop. Cap it; the file on aion-data stays the durable copy.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    build:
      context: .
      args:
        AION_BUILD_SHA: ${AION_BUILD_SHA:-unstamped}
    # The image entrypoint is the CLI. Compose appends `command` to an entrypoint rather
    # than replacing it, so the server has to override the entrypoint itself.
    entrypoint: ['node', '/app/packages/mcp/dist/main.js']
    env_file:
      - path: .env
        required: false
    environment:
      - AION_NEO4J_URI=${AION_NEO4J_URI:-bolt://neo4j:7687}
      - AION_OLLAMA_URL=${AION_OLLAMA_URL:-http://host.docker.internal:11434}
      - AION_MCP_PORT=${AION_MCP_PORT:-8765}
      - AION_LOG_FILE
      - AION_LOG_LEVEL
      # Concurrent reflection claim-and-run slots, default 1. Raising it only helps alongside
      # the host Ollama's OLLAMA_NUM_PARALLEL (see README's Development section); otherwise
      # every extra worker still queues behind the one model call the others are waiting on.
      # - AION_WORKER_COUNT=2
    ports:
      - '127.0.0.1:${AION_MCP_PORT:-8765}:${AION_MCP_PORT:-8765}'
    volumes:
      - aion-data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - neo4j

  # No profile: a bare `docker compose build` must produce the shared image. The
  # entrypoint is the CLI, so a stray `up` prints usage and exits.
  aion-cli:
    image: aion-local:latest
    build:
      context: .
      args:
        AION_BUILD_SHA: ${AION_BUILD_SHA:-unstamped}
    working_dir: /repo
    env_file:
      - path: .env
        required: false
    environment:
      - COMPOSE_PROJECT_NAME
      - AION_REPO_PATH
      - AION_GIT_USER_NAME
      - AION_REPO_HEAD_SHA
      - AION_HOOKS_INSTALLED
      - AION_NEO4J_URI=${AION_NEO4J_URI:-bolt://neo4j:7687}
      - AION_OLLAMA_URL=${AION_OLLAMA_URL:-http://host.docker.internal:11434}
      - AION_MCP_PORT=${AION_MCP_PORT:-8765}
      - AION_LOG_FILE
      - AION_LOG_LEVEL
    volumes:
      # The repo bind carries .env writes and compose.yaml; data never uses a bind mount.
      - ${AION_REPO_PATH:-.}:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - aion-data:/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  aion-data:
  aion-neo4j:
